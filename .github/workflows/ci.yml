name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
        pymodbus: ["3.9.2", "3.11.4", "latest"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e ".[dev]" c104 cantools
      - run: pip install "pymodbus==${{ matrix.pymodbus }}"
        if: matrix.pymodbus != 'latest'
      - run: ruff check src tests
      - run: mypy
      - run: pytest -q --cov=open_bess_edge --cov-report=term-missing
      - run: python scripts/verify_claims.py
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: bandit -q -r src/open_bess_edge -x src/open_bess_edge/experimental
      - run: pip-audit
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: pip install build && python -m build
      - run: docker build -t open-bess-edge:ci .
