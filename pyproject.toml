[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "open-bess-edge"
version = "3.1.0"
description = "Gateway industrial de borde para BESS: Modbus TCP, envolvente de seguridad, FFR/droop y Volt/VAR (SEN Chile)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "pymodbus>=3.9.2,<4",
    "pydantic>=2.5,<3",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[project.scripts]
open-bess-edge = "open_bess_edge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/open_bess_edge"]

[tool.hatch.build.targets.wheel.force-include]
"registry" = "open_bess_edge/registry"
"data/bess_safety_baseline.json" = "open_bess_edge/data/bess_safety_baseline.json"
"data/can_dbc" = "open_bess_edge/data/can_dbc"

[tool.hatch.build.targets.sdist]
include = ["src", "registry", "data", "config", "tests", "docs", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers"
markers = ["e2e: pruebas de extremo a extremo por TCP real", "slow: pruebas lentas"]

[tool.coverage.run]
source = ["src/open_bess_edge"]
branch = true
omit = ["src/open_bess_edge/experimental/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 135
target-version = "py310"
src = ["src", "tests"]
extend-exclude = [
    "hardware_simulator", "infrastructure", "arduino_cli_bin", "docs",
    "bessai-web", "portal_edge", "ai", "mcp_server", "models", "sec-bess-ingestor", "dashboard"
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "S311", "UP007", "UP006", "UP035", "UP045", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "E501", "E702", "E741", "E731", "ASYNC110"]
"src/open_bess_edge/experimental/*" = ["UP", "B", "E501", "S", "I", "F401", "ASYNC"]
"src/open_bess_edge/sim/*" = ["S"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/open_bess_edge"]

[[tool.mypy.overrides]]
module = "open_bess_edge.experimental.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = ["c104", "cantools", "cantools.*"]
ignore_missing_imports = true
